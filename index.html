<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <!-- My entire working page -->
    <main>
        <header class="main-header">
            <h1>AKAN NAME GENERATOR</h1>
            <p>Discover Ghananians' name based on day of the week they were born</p>
        </header>
        <!-- Form container -->
        <form>
            <!-- Birthdate selection -->
            <div class="input-group">
                <lable for="birthdate">Enter your Birthdate:</lable>
                <input for="date" id="birthdate" required placeholder="day/month/year">                
            </div>
            <!-- Gender Selection -->
            <div class="input-group">
                <span class="group-label">Select your gender:</span>

                <div class="radio-option">
                    <lable class="radio-lable">
                        <input type="radio" name="gender" value="male" required>
                        <span class="custom-radio">Male</span>
                    </lable>

                    <lable class="radio-lable">
                        <input type="radio" name="gender" value="female" required>
                        <span class="custom-radio">Female</span>
                    </lable>
                </div>
            </div>
        </form>       
         
    </main>
    
                
    </form>    
</body>
</html>
